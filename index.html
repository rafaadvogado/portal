<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}

header{background:var(--navy);color:var(--cream);padding:18px 20px;display:flex;align-items:center;gap:14px}
header img{width:46px;height:46px;border-radius:8px}

nav{background:var(--blue);display:flex;overflow-x:auto;gap:2px;padding:0 8px;position:sticky;top:0;z-index:40}nav a{color:#dfe7f6;text-decoration:none;padding:12px 12px;font-size:15px;white-space:nowrap;border-bottom:3px solid transparent}nav a.on{color:#fff;border-bottom-color:var(--cream);font-weight:600}

.areas{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.areas div{background:var(--paper);border-radius:12px;padding:12px 14px}.areas b{color:var(--navy);display:block;margin-bottom:2px}@media(max-width:480px){.areas{grid-template-columns:1fr}}
.post{border-top:1px solid var(--line);padding:14px 0}.post:first-of-type{border-top:0}.post h3{margin:2px 0 6px;font-size:18px;color:var(--navy);font-family:Georgia,serif}.post .d{font-size:13px;color:var(--mute);font-weight:600}.post p{margin:0 0 6px}
main{max-width:720px;margin:0 auto;padding:20px 16px 110px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 1px 2px rgba(15,30,58,.04)}

.cartao{width:100%;border-radius:12px;display:block;box-shadow:0 6px 20px rgba(15,30,58,.18)}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:#e6eefb;color:var(--blue)}
.tag.ok{background:#e3f3e9;color:var(--ok)}.tag.fim{background:#eceef2;color:#5d6676}
dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:14px 0 0}
dt{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}dd{margin:0;font-weight:500}
.w2{grid-column:1/-1}
.resumo{background:var(--paper);border-left:4px solid var(--sky);padding:12px 14px;border-radius:8px;margin-top:14px}
.tl{list-style:none;margin:10px 0 0;padding:0}

<body>
<header><img src="icon.png" alt=""><div><div class="n">Rafael de Mello Souza</div><div class="o">Advogado · OAB/SP 352.797</div></div></header>
<nav id="nav"><a href="#inicio">Início</a><a href="#quem-somos">Quem somos</a><a href="#noticias">Notícias</a><a href="#consulta">Consultar processo</a></nav>
<main id="main"></main>
<footer>Rafael de Mello Souza · Advogado · OAB/SP nº 352.797 · Bauru-SP<br><span id="atu"></span></footer>
<a id="fab" target="_blank" rel="noopener" aria-label="Falar comigo no WhatsApp">
<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><circle cx="8" cy="11" r="1.4" fill="#1f9d55"/><circle cx="12" cy="11" r="1.4" fill="#1f9d55"/><circle cx="16" cy="11" r="1.4" fill="#1f9d55"/></svg>
<span>WhatsApp</span></a>
<script>
/* ---------- estatística de visitas (Umami: sem cookies, sem dados pessoais) ---------- */
const UMAMI_ID = '';
function rastrear(ev, dados) { try { if (window.umami) ev ? umami.track(ev, dados) : umami.track(p => ({ ...p, url: '/' + (location.hash || '#inicio').split('/')[0], title: document.title })) } catch (e) { } }
if (UMAMI_ID) { const s = document.createElement('script'); s.defer = true; s.src = 'https://cloud.umami.is/script.js'; s.dataset.websiteId = UMAMI_ID; s.dataset.autoTrack = 'false'; s.onload = () => rastrear(); document.head.appendChild(s) }
document.addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return; const h = a.getAttribute('href') || '';
  const local = (location.hash || '#inicio').slice(1).split('/')[0] + (a.id === 'fab' ? '-botao-flutuante' : '');
  if (h.includes('wa.me')) rastrear('whatsapp', { local });
  else if (h.startsWith('mailto:')) rastrear('email', { local });
  else if (a.closest('.post')) rastrear('noticia-fonte', { url: h });
  else if (/^https?:/.test(h) && !h.includes(location.host)) rastrear('link-externo', { url: h });
}, true);
const ME = { nome: 'Rafael de Mello Souza', oab: 'OAB/SP nº 352.797', tel: '(14) 99611-9228', wa: '5514996119228', email: 'rafaelmsouza@adv.oabsp.org.br' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dig = s => String(s || '').replace(/\D/g, '');
const fd = s => { if (!s) return ''; const [y, m, d] = s.slice(0, 10).split('-'); return `${d}/${m}/${y}` };
const waLink = t => `https://wa.me/${ME.wa}?text=${encodeURIComponent(t)}`;
function setFab(t) { $('#fab').href = waLink(t) }
const MSG_PADRAO = 'Olá, Dr. Rafael! Vim pelo seu site e gostaria de falar com você.';

/* ---------- criptografia (igual ao gerador do ERMS) ---------- */
const ITER = 200000, te = new TextEncoder();
const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function pbkdf2(material, sal, bits) {
  const k = await crypto.subtle.importKey('raw', te.encode(material), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: sal, iterations: ITER }, k, bits));
}
async function abrir(numero, cpf, senha) {
  const material = `${dig(numero)}|${dig(cpf)}|${senha.trim()}`;
  const id = [...await pbkdf2(material, te.encode('erms-portal-id-v1'), 128)].map(b => b.toString(16).padStart(2, '0')).join('');
  const r = await fetch('d/' + id + '.json', { cache: 'no-cache' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('falha de conexão (' + r.status + ')');
  const f = await r.json();
  const chave = await crypto.subtle.importKey('raw', await pbkdf2(material, ub(f.s), 256), 'AES-GCM', false, ['decrypt']);
  const txt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(f.iv) }, chave, ub(f.c));
  return JSON.parse(new TextDecoder().decode(txt));
}

/* ---------- telas ---------- */
function telaConsulta(erro) {
  setFab(MSG_PADRAO);
  $('#main').innerHTML = `
  <div class="card">
    <h1>Consulte o seu processo</h1>
    <div class="sub">Área exclusiva para clientes. Informe os dados abaixo para ver a situação e os últimos andamentos.</div>
    <form id="f" autocomplete="off">
      <label for="num">Número do processo</label>
      <input id="num" inputmode="numeric" placeholder="0000000-00.0000.0.00.0000" required>
      <label for="cpf">CPF do cliente</label>
      <input id="cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="18" required>
      <label for="sen">Senha</label>
      <input id="sen" type="password" inputmode="numeric" placeholder="senha informada pelo escritório" required>
      <button class="pri" id="ok" type="submit">Consultar</button>
      <div id="msg" class="msg ${erro ? 'err' : ''}">${erro ? esc(erro) : ''}</div>
    </form>
    <p class="priv">🔒 Os dados são protegidos por criptografia e só podem ser abertos com o número do processo, o CPF e a senha. Não sabe a senha? Fale comigo no WhatsApp.</p>
  </div>
  <div class="card" style="display:none">
    <h2>Meu cartão</h2>
    <img class="cartao" src="cartao.jpg" alt="Cartão de visita de Rafael de Mello Souza, advogado, OAB/SP 352.797, WhatsApp (14) 99611-9228, e-mail rafaelmsouza@adv.oabsp.org.br">
    <div class="acts">
      <a class="btn wa" href="${waLink(MSG_PADRAO)}" target="_blank" rel="noopener">💬 Falar no WhatsApp</a>
      <button onclick="vcard()">👤 Salvar contato</button>
      <a class="btn" href="mailto:${ME.email}">✉️ E-mail</a>
      <button onclick="compartilhar()">📤 Compartilhar</button>
    </div>
  </div>`;
  const num = $('#num'), cpf = $('#cpf');
  num.addEventListener('input', () => { const d = dig(num.value).slice(0, 20); num.value = d.length === 20 ? `${d.slice(0, 7)}-${d.slice(7, 9)}.${d.slice(9, 13)}.${d[13]}.${d.slice(14, 16)}.${d.slice(16)}` : d });
  cpf.addEventListener('input', () => { const d = dig(cpf.value).slice(0, 14); cpf.value = d.length === 11 ? `${d.slice(0, 3)}.${d.slice(3, 6)}.${d.slice(6, 9)}-${d.slice(9)}` : d });
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const b = $('#ok'), m = $('#msg');
    if (dig(num.value).length !== 20) { m.className = 'msg err'; m.textContent = 'Confira o número do processo: ele tem 20 dígitos.'; return }
    if (![11, 14].includes(dig(cpf.value).length)) { m.className = 'msg err'; m.textContent = 'Confira o CPF (11 dígitos).'; return }
    b.disabled = true; b.innerHTML = '<span class="spin"></span> Consultando…'; m.className = 'msg';
    try {
      const p = await abrir(num.value, cpf.value, $('#sen').value);
      if (!p) { rastrear('consulta-nao-encontrado'); telaConsulta('Não encontramos um processo com esses dados. Confira o número, o CPF e a senha, ou fale comigo no WhatsApp.'); return }
      rastrear('consulta-ok'); telaProcesso(p);
    } catch (err) { telaConsulta('Não foi possível consultar agora (' + err.message + '). Tente de novo em instantes.') }
  };
}
function telaProcesso(p) {
  setFab(`Olá, Dr. Rafael! Sou ${p.cliente.split(' ')[0]}, cliente do processo ${p.numero}, e tenho uma dúvida:`);
  const st = p.ativo ? `<span class="tag ok">${esc(p.situacaoCadastral)}</span>` : `<span class="tag fim">${esc(p.situacaoCadastral)}</span>`;
  const I = (l, v, w) => v ? `<div class="${w ? 'w2' : ''}"><dt>${l}</dt><dd>${esc(v)}</dd></div>` : '';
  $('#main').innerHTML = `
  <div class="card">
    <div class="sub">Olá, ${esc(p.cliente.split(' ')[0])}!</div>
    <h1>Seu processo</h1>
    <div style="margin-top:4px">${st}</div>
    <dl>${I('Número', p.numero, 1)}${I('Ação', p.acao, 1)}${I('Área', p.area)}${I('Tribunal', p.tribunal)}${I('Vara / órgão', p.vara)}${I('Comarca', p.comarca)}${I('Parte contrária', p.parteContraria, 1)}</dl>
    ${p.resumo ? `<div class="resumo"><b>Em que fase está</b><br>${esc(p.resumo)}</div>` : ''}
  </div>
  ${p.agenda.length ? `<div class="card"><h2>📅 Próximos compromissos</h2>${p.agenda.map(a => `<div class="ag"><b>${esc(a.tipo)} – ${fd(a.data)}${a.hora ? ' às ' + esc(a.hora) : ''}</b><br>${esc(a.titulo)}${a.local ? `<div class="sub">${esc(a.local)}</div>` : ''}</div>`).join('')}<p class="sub">Em caso de dúvida sobre o que levar ou como se preparar, fale comigo.</p></div>` : ''}
  <div class="card"><h2>Últimos andamentos</h2>
    ${p.andamentos.length ? `<ul class="tl">${p.andamentos.map(a => `<li><div class="d">${fd(a.data)}</div>${esc(a.texto)}</li>`).join('')}</ul>` : '<p class="sub">Ainda não há andamentos registrados para consulta.</p>'}
    <p class="priv">Informações atualizadas em ${fd(p.atualizado)}. Elas resumem a movimentação do processo e não substituem a orientação do advogado.</p>
  </div>
  <div class="acts">
    <a class="btn wa" href="${waLink(`Olá, Dr. Rafael! Sou ${p.cliente.split(' ')[0]}, cliente do processo ${p.numero}, e tenho uma dúvida:`)}" target="_blank" rel="noopener">💬 Tirar dúvida no WhatsApp</a>
    <button onclick="telaConsulta()">Sair</button>
  </div>`;
  window.scrollTo(0, 0);
}

/* ---------- contato ---------- */
function vcard() {
  rastrear('salvar-contato');
  const v = ['BEGIN:VCARD', 'VERSION:3.0', 'N:Souza;Rafael de Mello;;;', 'FN:' + ME.nome, 'TITLE:Advogado – ' + ME.oab, 'TEL;TYPE=CELL:+' + ME.wa, 'EMAIL;TYPE=WORK:' + ME.email, 'URL:' + location.origin, 'END:VCARD'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([v], { type: 'text/vcard' })); a.download = 'rafael-de-mello-souza.vcf'; a.click();
}
async function compartilhar() {
  rastrear('compartilhar');
  const d = { title: 'Rafael de Mello Souza – Advogado', text: `${ME.nome} – Advogado, ${ME.oab}. WhatsApp ${ME.tel}`, url: location.origin + location.pathname };
  try { if (navigator.share) { await navigator.share(d); return } } catch (e) { if (e.name === 'AbortError') return }
  try { await navigator.clipboard.writeText(d.url); alert('Link copiado.') } catch (e) { prompt('Copie o link:', d.url) }
}
fetch('atualizado.json', { cache: 'no-cache' }).then(r => r.json()).then(j => { $('#atu').textContent = 'Consulta atualizada em ' + fd(j.atualizado) + ' às ' + j.atualizado.slice(11, 16) }).catch(() => { });
/* ---------- conteúdo institucional ---------- */
const AREAS = [
  ['Direito Previdenciário', 'Aposentadorias, pensão por morte, auxílios por incapacidade, salário-maternidade, revisões e planejamento previdenciário.'],
  ['Direito da Assistência Social', 'Benefício de Prestação Continuada (BPC/LOAS) para pessoa idosa e pessoa com deficiência.'],
  ['Direito da Seguridade Social', 'Visão integrada de previdência, assistência e saúde, os três pilares da Seguridade Social.'],
  ['Direito da Saúde', 'Acesso a tratamentos, medicamentos e direitos de pacientes perante o SUS e planos de saúde.'],
  ['Direito Processual Previdenciário', 'Atuação em processos administrativos no INSS e judiciais nos Juizados Especiais Federais, Justiça Federal e Turmas Recursais.']
];
const cartaoHtml = () => `<div class="card"><h2>Meu cartão</h2>
  <img class="cartao" src="cartao.jpg" alt="Cartão de visita de Rafael de Mello Souza, advogado, OAB/SP 352.797, WhatsApp (14) 99611-9228, e-mail rafaelmsouza@adv.oabsp.org.br">
  <div class="acts"><a class="btn wa" href="${waLink(MSG_PADRAO)}" target="_blank" rel="noopener">💬 Falar no WhatsApp</a><button onclick="vcard()">👤 Salvar contato</button><a class="btn" href="mailto:${ME.email}">✉️ E-mail</a><button onclick="compartilhar()">📤 Compartilhar</button></div></div>`;
let NOTICIAS = null;
async function noticias() { if (NOTICIAS) return NOTICIAS; try { NOTICIAS = (await (await fetch('noticias.json', { cache: 'no-cache' })).json()).sort((a, b) => b.data.localeCompare(a.data)) } catch (e) { NOTICIAS = [] } return NOTICIAS }
const postHtml = n => `<div class="post" id="n-${esc(n.id)}"><div class="d">${fd(n.data)}</div><h3>${esc(n.titulo)}</h3>${String(n.texto).split(/\n+/).map(t => `<p>${esc(t)}</p>`).join('')}${n.fonte ? `<div class="sub">Fonte: <a href="${esc(n.fonte)}" target="_blank" rel="noopener">${esc(n.fonteNome || 'link')}</a></div>` : ''}</div>`;
async function telaInicioSite() {
  setFab(MSG_PADRAO);
  const ns = (await noticias()).slice(0, 3);
  $('#main').innerHTML = `<div class="hero"><h1>Advocacia previdenciária</h1><p>INSS, BPC/LOAS, aposentadorias, auxílios e pensões. Atendimento em Bauru-SP e pelo WhatsApp.</p>
    <div class="acts"><a class="btn wa" href="${waLink(MSG_PADRAO)}" target="_blank" rel="noopener">💬 Falar no WhatsApp</a><a class="btn" href="#consulta">🔎 Consultar meu processo</a></div></div>
  <div class="card"><h2>Áreas de atuação</h2><div class="areas">${AREAS.map(([t, d]) => `<div><b>${t}</b><span class="sub">${d}</span></div>`).join('')}</div><p style="margin-top:12px"><a href="#quem-somos">Conheça a minha trajetória →</a></p></div>
  ${ns.length ? `<div class="card"><h2>Notícias</h2>${ns.map(postHtml).join('')}<p><a href="#noticias">Ver todas as notícias →</a></p></div>` : ''}
  ${cartaoHtml()}`;
}
function telaQuemSomos() {
  setFab(MSG_PADRAO);
  $('#main').innerHTML = `<div class="card"><h1>Quem somos</h1>
  <p>Sou <b>Rafael de Mello Souza</b>, advogado inscrito na OAB/SP sob o nº 352.797, com escritório em Bauru-SP.</p>
  <p>Atuo com o <b>Direito Previdenciário desde 2008</b> e exerço a <b>advocacia desde 2014</b>. São muitos anos dedicados a quem precisa do INSS: pessoas que buscam a aposentadoria, um auxílio por incapacidade, a pensão de um familiar ou o BPC/LOAS.</p>
  <p>O meu trabalho é explicar cada etapa com clareza, cuidar dos prazos com rigor e manter o cliente informado do começo ao fim, tanto no pedido administrativo no INSS quanto no processo judicial.</p>
  <h2 style="margin-top:18px">Áreas de atuação</h2><div class="areas">${AREAS.map(([t, d]) => `<div><b>${t}</b><span class="sub">${d}</span></div>`).join('')}</div>
  <h2 style="margin-top:18px">Como funciona o atendimento</h2>
  <p>O primeiro contato pode ser feito pelo WhatsApp. Os clientes acompanham o andamento do processo por aqui mesmo, na área <a href="#consulta">Consultar processo</a>, com número do processo, CPF e senha.</p></div>
  ${cartaoHtml()}`;
}
async function telaNoticias(id) {
  setFab(MSG_PADRAO);
  const ns = await noticias();
  $('#main').innerHTML = `<div class="card"><h1>Notícias</h1><div class="sub">Novidades sobre INSS e Direito Previdenciário, toda segunda, quarta e sexta.</div>
  ${ns.length ? ns.map(postHtml).join('') : '<p class="sub">Em breve.</p>'}
  <p class="priv">Conteúdo informativo. Cada caso tem particularidades: em caso de dúvida, fale comigo.</p></div>`;
  if (id) { const e = document.getElementById('n-' + id); e && e.scrollIntoView() }
}
function rota() {
  setTimeout(() => rastrear(), 0);
  const h = (location.hash || '#inicio').slice(1), [r, arg] = h.split('/');
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + r));
  if (r === 'consulta') telaConsulta();
  else if (r === 'quem-somos') telaQuemSomos();
  else if (r === 'noticias') telaNoticias(arg);
  else telaInicioSite();
  if (r !== 'noticias' || !arg) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', rota);
rota();
</script>
